<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy Earn Pro - Login & Register</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK (Compat Version for Webview & GitHub Pages) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #0d1117;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            background: #161b22;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 30px 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            position: relative;
        }
        .logo-box {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo-box i {
            font-size: 50px;
            color: #00e676;
            margin-bottom: 10px;
        }
        .logo-box h2 {
            font-size: 24px;
            font-weight: 700;
        }
        .logo-box h2 span {
            color: #00e676;
        }
        .form-box {
            background: #21262d;
            padding: 25px 20px;
            border-radius: 16px;
            border: 1px solid #30363d;
        }
        .form-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: center;
        }
        .input-group {
            margin-bottom: 15px;
            position: relative;
        }
        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #8b949e;
        }
        .input-group input {
            width: 100%;
            padding: 14px 14px 14px 45px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }
        .input-group input:focus {
            border-color: #00e676;
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00c853, #00e676);
            color: #0d1117;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }
        .btn-submit:active {
            transform: scale(0.98);
        }
        .toggle-text {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #8b949e;
        }
        .toggle-text span {
            color: #00e676;
            font-weight: 600;
            cursor: pointer;
        }
        .alert-msg {
            background: rgba(255, 82, 82, 0.2);
            border: 1px solid #ff5252;
            color: #ff5252;
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            margin-bottom: 15px;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="logo-box">
            <i class="fa-solid fa-coins"></i>
            <h2>Easy Earn <span>Pro</span></h2>
        </div>

        <div id="alertBox" class="alert-msg"></div>

        <!-- LOGIN FORM -->
        <div class="form-box" id="loginBox">
            <div class="form-title">Welcome Back!</div>
            <div class="input-group">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" id="loginEmail" placeholder="Email Address">
            </div>
            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="loginPassword" placeholder="Password">
            </div>
            <button class="btn-submit" onclick="loginUser()">Login</button>
            <div class="toggle-text">
                Don't have an account? <span onclick="showRegister()">Register</span>
            </div>
        </div>

        <!-- REGISTER FORM -->
        <div class="form-box" id="registerBox" style="display: none;">
            <div class="form-title">Create Account</div>
            <div class="input-group">
                <i class="fa-solid fa-user"></i>
                <input type="text" id="regName" placeholder="Full Name">
            </div>
            <div class="input-group">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" id="regEmail" placeholder="Email Address">
            </div>
            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="regPassword" placeholder="Password (Min 6 chars)">
            </div>
            <button class="btn-submit" onclick="registerUser()">Register</button>
            <div class="toggle-text">
                Already have an account? <span onclick="showLogin()">Login</span>
            </div>
        </div>
    </div>

    <script>
        // FIREBASE CONFIGURATION
        const firebaseConfig = {
            apiKey: "AIzaSyC2hkHUlQ1A6XxZmVijhVqhVsPPVZzoJ5Q",
            authDomain: "easy-earn-db419.firebaseapp.com",
            databaseURL: "https://easy-earn-db419-default-rtdb.firebaseio.com",
            projectId: "easy-earn-db419",
            storageBucket: "easy-earn-db419.firebasestorage.app",
            messagingSenderId: "443404620896",
            appId: "1:443404620896:web:4a5637954440a8f8c09f05",
            measurementId: "G-MTY2FYGFFQ"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        // Check if User is Already Logged In
        auth.onAuthStateChanged(user => {
            if (user) {
                window.location.href = "main.html";
            }
        });

        // Toggle Views
        function showRegister() {
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('registerBox').style.display = 'block';
            hideAlert();
        }

        function showLogin() {
            document.getElementById('registerBox').style.display = 'none';
            document.getElementById('loginBox').style.display = 'block';
            hideAlert();
        }

        function showAlert(msg) {
            const alertBox = document.getElementById('alertBox');
            alertBox.innerText = msg;
            alertBox.style.display = 'block';
        }

        function hideAlert() {
            document.getElementById('alertBox').style.display = 'none';
        }

        // Register Function
        function registerUser() {
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value.trim();

            if (!name || !email || !password) {
                showAlert("Please fill in all fields.");
                return;
            }

            auth.createUserWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    const user = userCredential.user;
                    // Save Initial User Data in Realtime Database
                    db.ref('users/' + user.uid).set({
                        name: name,
                        email: email,
                        coins: 100, // Welcome Bonus Coins
                        createdAt: new Date().toISOString()
                    }).then(() => {
                        window.location.href = "main.html";
                    });
                })
                .catch((error) => {
                    showAlert(error.message);
                });
        }

        // Login Function
        function loginUser() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            if (!email || !password) {
                showAlert("Please enter email and password.");
                return;
            }

            auth.signInWithEmailAndPassword(email, password)
                .then(() => {
                    window.location.href = "main.html";
                })
                .catch((error) => {
                    showAlert(error.message);
                });
        }
    </script>
</body>
</html>
