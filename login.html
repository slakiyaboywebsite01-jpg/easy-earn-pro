<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy Earn Pro - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #f0f4f8;
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            background: #ffffff;
            padding: 35px 25px;
            border-radius: 24px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #10b981, #06b6d4);
        }
        .logo-icon {
            font-size: 48px;
            background: linear-gradient(135deg, #10b981, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .login-card h2 {
            font-size: 22px;
            color: #0f172a;
            margin-bottom: 5px;
        }
        .login-card p {
            color: #64748b;
            font-size: 13px;
            margin-bottom: 25px;
        }
        .form-control {
            width: 100%;
            padding: 14px;
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            color: #0f172a;
            font-size: 15px;
            outline: none;
            margin-bottom: 15px;
            transition: 0.3s;
        }
        .form-control:focus {
            border-color: #10b981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
            background: #ffffff;
        }
        .auth-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #10b981, #06b6d4);
            color: #ffffff;
            font-weight: 700;
            font-size: 16px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
        }
        .auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
        }
        #auth-msg {
            margin-top: 15px;
            font-weight: 600;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <i class="fa-solid fa-coins logo-icon"></i>
        <h2>Easy Earn Pro</h2>
        <p>Login or Register to start earning</p>

        <input type="text" id="username" class="form-control" placeholder="Your Name" autocomplete="off">
        <input type="email" id="email" class="form-control" placeholder="Email Address" autocomplete="off">
        <input type="password" id="password" class="form-control" placeholder="Password">

        <button class="auth-btn" onclick="handleAuth()">CONTINUE</button>

        <div id="auth-msg"></div>
    </div>

    <script>
        // FIREBASE CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyC2hkHUlQ1A6XxZmVijhVqhVsPPVZzoJ5Q",
            authDomain: "easy-earn-db419.firebaseapp.com",
            databaseURL: "https://easy-earn-db419-default-rtdb.firebaseio.com",
            projectId: "easy-earn-db419",
            storageBucket: "easy-earn-db419.firebasestorage.app",
            messagingSenderId: "443404620896",
            appId: "1:443404620896:web:4a5637954440a8f8c09f05",
            measurementId: "G-MTY2FYGFFQ"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        function handleAuth() {
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const msg = document.getElementById('auth-msg');

            if (!email || !password) {
                msg.style.color = '#ef4444';
                msg.innerText = "Please fill all fields!";
                return;
            }

            auth.signInWithEmailAndPassword(email, password)
            .then((userCredential) => {
                window.location.href = "main.html";
            })
            .catch((error) => {
                if (error.code === 'auth/user-not-found') {
                    auth.createUserWithEmailAndPassword(email, password)
                    .then((userCredential) => {
                        const uid = userCredential.user.uid;
                        database.ref('users/' + uid).set({
                            username: username || 'User',
                            email: email,
                            coins: 0
                        }).then(() => {
                            window.location.href = "main.html";
                        });
                    })
                    .catch(err => {
                        msg.style.color = '#ef4444';
                        msg.innerText = err.message;
                    });
                } else {
                    msg.style.color = '#ef4444';
                    msg.innerText = error.message;
                }
            });
        }
    </script>
</body>
</html>
