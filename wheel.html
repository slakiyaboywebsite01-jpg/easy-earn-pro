<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #f0f4f8;
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 15px;
        }
        .container {
            width: 100%;
            max-width: 450px;
            background: #ffffff;
            padding: 20px;
            border-radius: 24px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            text-align: center;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8fafc;
            padding: 12px 18px;
            border-radius: 16px;
            margin-bottom: 20px;
            border: 1px solid #e2e8f0;
        }
        .back-btn {
            color: #0f172a;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }
        .back-btn:hover {
            color: #10b981;
        }
        .coin-box {
            background: linear-gradient(135deg, #10b981, #06b6d4);
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
        }
        .wheel-card {
            background: #f8fafc;
            padding: 25px 15px;
            border-radius: 20px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
            position: relative;
            overflow: hidden;
        }
        .wheel-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #10b981, #06b6d4);
        }
        .wheel-wrapper {
            position: relative;
            width: 270px;
            height: 270px;
            margin: 15px auto;
        }
        #wheelCanvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
            border: 4px solid #ffffff;
        }
        .pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 25px solid #ef4444;
            z-index: 10;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        }
        .spin-btn {
            background: linear-gradient(135deg, #10b981, #06b6d4);
            color: #ffffff;
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.3s;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
        }
        .spin-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
        }
        .spin-btn:disabled {
            background: #cbd5e1;
            color: #94a3b8;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }
        #status-msg {
            margin-top: 15px;
            font-weight: 600;
            min-height: 24px;
            color: #10b981;
            font-size: 15px;
        }
        .ad-container {
            margin-top: 20px;
            padding: 10px;
            background: #f8fafc;
            border-radius: 14px;
            border: 1px solid #e2e8f0;
            overflow: hidden;
            display: flex;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <a href="main.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Back</a>
            <h3 style="font-size: 18px; color: #0f172a;">Spin & Earn</h3>
            <div class="coin-box">
                <i class="fa-solid fa-coins"></i>
                <span id="user-coins">0</span>
            </div>
        </div>

        <!-- Wheel Card -->
        <div class="wheel-card">
            <div class="wheel-wrapper">
                <div class="pointer"></div>
                <canvas id="wheelCanvas" width="300" height="300"></canvas>
            </div>

            <p id="status-msg">Spin the wheel to win coins!</p>

            <button id="spinBtn" class="spin-btn" onclick="spinWheel()">SPIN NOW</button>
        </div>

        <!-- Adsterra Banner -->
        <div class="ad-container">
            <script async="async" data-cfasync="false" src="https://pl30586105.effectivecpmnetwork.com/ddfa585c0174aba472cef073b8d260d0/invoke.js"></script>
            <div id="container-ddfa585c0174aba472cef073b8d260d0"></div>
        </div>
    </div>

    <script>
        // FIREBASE CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyC2hkHUlQ1A6XxZmVijhVqhVsPPVZzoJ5Q",
            authDomain: "easy-earn-db419.firebaseapp.com",
            databaseURL: "https://easy-earn-db419-default-rtdb.firebaseio.com",
            projectId: "easy-earn-db419",
            storageBucket: "easy-earn-db419.firebasestorage.app",
            messagingSenderId: "443404620896",
            appId: "1:443404620896:web:4a5637954440a8f8c09f05",
            measurementId: "G-MTY2FYGFFQ"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        let currentUser = null;

        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                database.ref('users/' + user.uid + '/coins').on('value', snapshot => {
                    document.getElementById('user-coins').innerText = snapshot.val() || 0;
                });
            } else {
                window.location.href = "login.html";
            }
        });

        // WHEEL SETUP
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const prizes = [2, 5, 8, 10, 12, 15];
        const colors = ['#10b981', '#3b82f6', '#f59e0b', '#8b5cf6', '#ec4899', '#06b6d4'];
        
        let startAngle = 0;
        const arc = Math.PI / (prizes.length / 2);
        let spinTimeout = null;
        let spinAngleStart = 10;
        let spinTime = 0;
        let spinTimeTotal = 0;
        let isSpinning = false;

        function drawWheel() {
            ctx.clearRect(0, 0, 300, 300);
            for (let i = 0; i < prizes.length; i++) {
                const angle = startAngle + i * arc;
                ctx.fillStyle = colors[i];
                ctx.beginPath();
                ctx.arc(150, 150, 140, angle, angle + arc, false);
                ctx.arc(150, 150, 0, angle + arc, angle, true);
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = "#ffffff";
                ctx.stroke();

                ctx.save();
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 16px Poppins";
                ctx.translate(150 + Math.cos(angle + arc / 2) * 95, 150 + Math.sin(angle + arc / 2) * 95);
                ctx.rotate(angle + arc / 2 + Math.PI / 2);
                ctx.fillText(prizes[i] + " Coins", -25, 0);
                ctx.restore();
            }
        }

        drawWheel();

        function spinWheel() {
            if (isSpinning || !currentUser) return;

            isSpinning = true;
            document.getElementById('spinBtn').disabled = true;
            document.getElementById('status-msg').innerText = "Spinning...";

            spinAngleStart = Math.random() * 10 + 10;
            spinTime = 0;
            spinTimeTotal = Math.random() * 3000 + 4000;
            rotateWheel();
        }

        function rotateWheel() {
            spinTime += 30;
            if (spinTime >= spinTimeTotal) {
                stopRotateWheel();
                return;
            }
            const spinAngle = spinAngleStart - easeOut(spinTime, 0, spinAngleStart, spinTimeTotal);
            startAngle += (spinAngle * Math.PI / 180);
            drawWheel();
            spinTimeout = setTimeout(rotateWheel, 30);
        }

        function stopRotateWheel() {
            clearTimeout(spinTimeout);
            const degrees = startAngle * 180 / Math.PI + 90;
            const arcd = arc * 180 / Math.PI;
            const index = Math.floor((360 - (degrees % 360)) / arcd);
            const wonCoins = prizes[index];

            document.getElementById('status-msg').innerText = `You won +${wonCoins} Coins!`;

            const userCoinsRef = database.ref('users/' + currentUser.uid + '/coins');
            userCoinsRef.transaction((currentValue) => {
                return (currentValue || 0) + wonCoins;
            }).then(() => {
                isSpinning = false;
                document.getElementById('spinBtn').disabled = false;
            }).catch(error => {
                console.error("Firebase Transaction Failed:", error);
                isSpinning = false;
                document.getElementById('spinBtn').disabled = false;
            });
        }

        function easeOut(t, b, c, d) {
            const ts = (t /= d) * t;
            const tc = ts * t;
            return b + c * (tc + -3 * ts + 3 * t);
        }
    </script>
</body>
</html>
