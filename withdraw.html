<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy Earn Pro - Withdraw</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #f0f4f8;
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 15px;
        }
        .container {
            width: 100%;
            max-width: 450px;
            background: #ffffff;
            padding: 20px;
            border-radius: 24px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            text-align: center;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8fafc;
            padding: 12px 18px;
            border-radius: 16px;
            margin-bottom: 20px;
            border: 1px solid #e2e8f0;
        }
        .back-btn {
            color: #0f172a;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }
        .back-btn:hover {
            color: #10b981;
        }
        .coin-box {
            background: linear-gradient(135deg, #10b981, #06b6d4);
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
        }
        .withdraw-card {
            background: #f8fafc;
            padding: 25px 20px;
            border-radius: 20px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
            position: relative;
            overflow: hidden;
            text-align: left;
        }
        .withdraw-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #10b981, #06b6d4);
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            color: #64748b;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .form-control {
            width: 100%;
            padding: 14px;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            color: #0f172a;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }
        .form-control:focus {
            border-color: #10b981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
        }
        .withdraw-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #10b981, #06b6d4);
            color: #ffffff;
            font-weight: 700;
            font-size: 16px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
            margin-top: 10px;
        }
        .withdraw-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
        }
        #msg {
            margin-top: 15px;
            font-weight: 600;
            text-align: center;
            font-size: 14px;
            min-height: 20px;
        }
        .ad-container {
            margin-top: 20px;
            padding: 10px;
            background: #f8fafc;
            border-radius: 14px;
            border: 1px solid #e2e8f0;
            overflow: hidden;
            display: flex;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <a href="main.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Back</a>
            <h3 style="font-size: 18px; color: #0f172a;">Withdraw</h3>
            <div class="coin-box">
                <i class="fa-solid fa-coins"></i>
                <span id="user-coins">0</span>
            </div>
        </div>

        <!-- Withdraw Card -->
        <div class="withdraw-card">
            <div class="form-group">
                <label>Select Payment Method</label>
                <select id="method" class="form-control">
                    <option value="ff">Free Fire Diamonds (100 Coins = 50 Diamonds)</option>
                    <option value="binance">Binance USDT (500 Coins = 1 USDT)</option>
                    <option value="paytm">Paytm / Mobile Recharge (200 Coins)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Free Fire Player ID / Wallet Address</label>
                <input type="text" id="accountDetails" class="form-control" placeholder="e.g., 1234567890" autocomplete="off">
            </div>

            <button class="withdraw-btn" onclick="processWithdraw()">SUBMIT WITHDRAWAL</button>

            <div id="msg"></div>
        </div>

        <!-- Adsterra Banner -->
        <div class="ad-container">
            <script async="async" data-cfasync="false" src="https://pl30586105.effectivecpmnetwork.com/ddfa585c0174aba472cef073b8d260d0/invoke.js"></script>
            <div id="container-ddfa585c0174aba472cef073b8d260d0"></div>
        </div>
    </div>

    <script>
        // FIREBASE CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyC2hkHUlQ1A6XxZmVijhVqhVsPPVZzoJ5Q",
            authDomain: "easy-earn-db419.firebaseapp.com",
            databaseURL: "https://easy-earn-db419-default-rtdb.firebaseio.com",
            projectId: "easy-earn-db419",
            storageBucket: "easy-earn-db419.firebasestorage.app",
            messagingSenderId: "443404620896",
            appId: "1:443404620896:web:4a5637954440a8f8c09f05",
            measurementId: "G-MTY2FYGFFQ"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        let currentUser = null;
        let userCoins = 0;

        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                database.ref('users/' + user.uid + '/coins').on('value', snapshot => {
                    userCoins = snapshot.val() || 0;
                    document.getElementById('user-coins').innerText = userCoins;
                });
            } else {
                window.location.href = "login.html";
            }
        });

        function processWithdraw() {
            const method = document.getElementById('method').value;
            const accountDetails = document.getElementById('accountDetails').value.trim();
            const msg = document.getElementById('msg');

            if (!accountDetails) {
                msg.style.color = '#ef4444';
                msg.innerText = "Please enter your Account/ID details!";
                return;
            }

            let requiredCoins = 100;
            if (method === 'binance') requiredCoins = 500;
            if (method === 'paytm') requiredCoins = 200;

            if (userCoins < requiredCoins) {
                msg.style.color = '#ef4444';
                msg.innerText = `Insufficient Coins! Min required: ${requiredCoins} Coins.`;
                return;
            }

            const userCoinsRef = database.ref('users/' + currentUser.uid + '/coins');
            userCoinsRef.transaction((curr) => {
                if ((curr || 0) >= requiredCoins) {
                    return curr - requiredCoins;
                }
                return;
            }).then((result) => {
                if (result.committed) {
                    database.ref('withdrawals').push({
                        userId: currentUser.uid,
                        method: method,
                        account: accountDetails,
                        coins: requiredCoins,
                        timestamp: Date.now(),
                        status: 'Pending'
                    });

                    msg.style.color = '#10b981';
                    msg.innerText = "Withdrawal request submitted successfully!";
                    document.getElementById('accountDetails').value = '';
                } else {
                    msg.style.color = '#ef4444';
                    msg.innerText = "Transaction failed. Try again.";
                }
            });
        }
    </script>
</body>
</html>
