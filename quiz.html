<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy Earn Pro - Math Quiz</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #0d1117;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            background: #161b22;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            text-align: center;
        }
        
        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 15px;
            border-bottom: 1px solid #30363d;
        }
        .back-btn {
            background: #21262d;
            border: 1px solid #30363d;
            color: #fff;
            padding: 10px 14px;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            font-size: 16px;
        }
        .coins-display {
            background: #21262d;
            border: 1px solid #00e676;
            padding: 8px 15px;
            border-radius: 20px;
            color: #00e676;
            font-weight: 700;
        }

        /* Quiz Card */
        .quiz-card {
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 30px 20px;
            margin: 20px 0;
        }
        .question-box {
            font-size: 36px;
            font-weight: 700;
            color: #00e676;
            margin-bottom: 25px;
            letter-spacing: 2px;
        }
        .input-answer {
            width: 100%;
            padding: 14px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 10px;
            color: #fff;
            font-size: 18px;
            text-align: center;
            outline: none;
            margin-bottom: 15px;
        }
        .input-answer:focus {
            border-color: #00e676;
        }

        /* Button */
        .btn-submit {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #00c853, #00e676);
            color: #0d1117;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0, 230, 118, 0.3);
        }
        .btn-submit:active {
            transform: scale(0.98);
        }
        
        .result-msg {
            font-size: 16px;
            font-weight: 600;
            min-height: 25px;
            margin-bottom: 15px;
        }
        .success { color: #00e676; }
        .error { color: #ff5252; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <a href="main.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Back</a>
            <h2>Math Quiz</h2>
            <div class="coins-display"><i class="fa-solid fa-coins"></i> <span id="userCoins">0</span></div>
        </div>

        <!-- Quiz Area -->
        <div class="quiz-card">
            <div class="result-msg" id="resultMsg">Solve the question to earn +15 Coins!</div>
            <div class="question-box" id="questionBox">0 + 0 = ?</div>
            <input type="number" id="userAnswer" class="input-answer" placeholder="Enter your answer">
            <button class="btn-submit" onclick="submitAnswer()">SUBMIT ANSWER</button>
        </div>

        <div></div>
    </div>

    <script>
        // FIREBASE CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyC2hkHUlQ1A6XxZmVijhVqhVsPPVZzoJ5Q",
            authDomain: "easy-earn-db419.firebaseapp.com",
            databaseURL: "https://easy-earn-db419-default-rtdb.firebaseio.com",
            projectId: "easy-earn-db419",
            storageBucket: "easy-earn-db419.firebasestorage.app",
            messagingSenderId: "443404620896",
            appId: "1:443404620896:web:4a5637954440a8f8c09f05",
            measurementId: "G-MTY2FYGFFQ"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        let currentUserId = null;
        let currentCoins = 0;
        let correctAnswer = 0;

        // Check Auth
        auth.onAuthStateChanged(user => {
            if (user) {
                currentUserId = user.uid;
                db.ref('users/' + user.uid).on('value', snapshot => {
                    const data = snapshot.val();
                    if(data) {
                        currentCoins = data.coins || 0;
                        document.getElementById('userCoins').innerText = currentCoins;
                    }
                });
                generateQuestion();
            } else {
                window.location.href = "login.html";
            }
        });

        // Generate Random Math Question
        function generateQuestion() {
            const num1 = Math.floor(Math.random() * 50) + 1;
            const num2 = Math.floor(Math.random() * 50) + 1;
            const isAddition = Math.random() > 0.5;

            if (isAddition) {
                correctAnswer = num1 + num2;
                document.getElementById('questionBox').innerText = `${num1} + ${num2} = ?`;
            } else {
                // Ensure positive result for subtraction
                const max = Math.max(num1, num2);
                const min = Math.min(num1, num2);
                correctAnswer = max - min;
                document.getElementById('questionBox').innerText = `${max} - ${min} = ?`;
            }
            document.getElementById('userAnswer').value = '';
        }

        // Check Answer
        function submitAnswer() {
            const userAns = parseInt(document.getElementById('userAnswer').value);
            const msgBox = document.getElementById('resultMsg');

            if (isNaN(userAns)) {
                msgBox.innerText = "Please enter an answer!";
                msgBox.className = "result-msg error";
                return;
            }

            if (userAns === correctAnswer) {
                currentCoins += 15;
                db.ref('users/' + currentUserId).update({
                    coins: currentCoins
                }).then(() => {
                    msgBox.innerText = "Correct Answer! +15 Coins Added 🎉";
                    msgBox.className = "result-msg success";
                    setTimeout(() => {
                        msgBox.innerText = "Solve the question to earn +15 Coins!";
                        msgBox.className = "result-msg";
                        generateQuestion();
                    }, 1500);
                });
            } else {
                msgBox.innerText = "Wrong Answer! Try again.";
                msgBox.className = "result-msg error";
            }
        }
    </script>
</body>
</html>
