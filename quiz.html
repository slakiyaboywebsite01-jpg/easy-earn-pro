<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy Earn Pro - Math Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #0d1117;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 15px;
        }
        .container {
            width: 100%;
            max-width: 450px;
            background: #161b22;
            padding: 20px;
            border-radius: 16px;
            border: 1px solid #30363d;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #21262d;
            padding: 12px 15px;
            border-radius: 12px;
            margin-bottom: 25px;
        }
        .back-btn {
            color: #00e676;
            font-size: 20px;
            text-decoration: none;
        }
        .coin-box {
            background: #00e676;
            color: #000;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .quiz-card {
            background: #21262d;
            padding: 25px 20px;
            border-radius: 14px;
            border: 1px solid #30363d;
        }
        .quiz-card p {
            color: #8b949e;
            font-size: 14px;
            margin-bottom: 15px;
        }
        .question-text {
            font-size: 32px;
            font-weight: 700;
            color: #00e676;
            margin-bottom: 20px;
        }
        .answer-input {
            width: 100%;
            padding: 14px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 10px;
            color: #fff;
            font-size: 18px;
            text-align: center;
            margin-bottom: 15px;
            outline: none;
        }
        .answer-input:focus {
            border-color: #00e676;
        }
        .submit-btn {
            width: 100%;
            padding: 14px;
            background: #00e676;
            color: #000;
            font-weight: 700;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }
        .submit-btn:hover {
            background: #00c853;
        }
        .submit-btn:disabled {
            background: #484f58;
            color: #8b949e;
            cursor: not-allowed;
        }
        #result-msg {
            margin-top: 15px;
            font-weight: 600;
            font-size: 15px;
            min-height: 24px;
        }
        .ad-container {
            margin-top: 25px;
            padding: 10px;
            background: #21262d;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <a href="main.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Back</a>
            <h3 style="font-size: 18px;">Math Quiz</h3>
            <div class="coin-box">
                <i class="fa-solid fa-coins"></i>
                <span id="user-coins">0</span>
            </div>
        </div>

        <!-- Quiz Card -->
        <div class="quiz-card">
            <p>Solve the question to earn <b>+5 Coins!</b></p>
            <div class="question-text" id="question">0 + 0 = ?</div>
            
            <input type="number" id="answerInput" class="answer-input" placeholder="Enter your answer" autocomplete="off">
            
            <button id="submitBtn" class="submit-btn" onclick="submitAnswer()">SUBMIT ANSWER</button>
            
            <div id="result-msg"></div>
        </div>

        <!-- Adsterra Banner -->
        <div class="ad-container">
            <script async="async" data-cfasync="false" src="https://pl30586105.effectivecpmnetwork.com/ddfa585c0174aba472cef073b8d260d0/invoke.js"></script>
            <div id="container-ddfa585c0174aba472cef073b8d260d0"></div>
        </div>
    </div>

    <script>
        // FIREBASE CONFIGURATION
        const firebaseConfig = {
            apiKey: "AIzaSyC2hkHUlQ1A6XxZmVijhVqhVsPPVZzoJ5Q",
            authDomain: "easy-earn-db419.firebaseapp.com",
            databaseURL: "https://easy-earn-db419-default-rtdb.firebaseio.com",
            projectId: "easy-earn-db419",
            storageBucket: "easy-earn-db419.firebasestorage.app",
            messagingSenderId: "443404620896",
            appId: "1:443404620896:web:4a5637954440a8f8c09f05",
            measurementId: "G-MTY2FYGFFQ"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        let currentUser = null;
        let correctAnswer = 0;

        // AUTH CHECK & LOAD USER COINS
        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                database.ref('users/' + user.uid + '/coins').on('value', snapshot => {
                    document.getElementById('user-coins').innerText = snapshot.val() || 0;
                });
                generateQuestion();
            } else {
                window.location.href = "login.html";
            }
        });

        // GENERATE RANDOM MATH QUESTION
        function generateQuestion() {
            const num1 = Math.floor(Math.random() * 50) + 10;
            const num2 = Math.floor(Math.random() * 50) + 1;
            const isAddition = Math.random() > 0.3; // 70% addition, 30% subtraction

            if (isAddition) {
                correctAnswer = num1 + num2;
                document.getElementById('question').innerText = `${num1} + ${num2} = ?`;
            } else {
                // Ensure positive result for subtraction
                const max = Math.max(num1, num2);
                const min = Math.min(num1, num2);
                correctAnswer = max - min;
                document.getElementById('question').innerText = `${max} - ${min} = ?`;
            }

            document.getElementById('answerInput').value = '';
            document.getElementById('result-msg').innerText = '';
            document.getElementById('submitBtn').disabled = false;
        }

        // SUBMIT ANSWER AND VERIFY
        function submitAnswer() {
            const userInput = document.getElementById('answerInput').value.trim();
            const resultMsg = document.getElementById('result-msg');
            const submitBtn = document.getElementById('submitBtn');

            if (userInput === '') {
                resultMsg.style.color = '#ff1744';
                resultMsg.innerText = 'Please enter an answer!';
                return;
            }

            submitBtn.disabled = true;

            if (parseInt(userInput) === correctAnswer) {
                resultMsg.style.color = '#00e676';
                resultMsg.innerText = 'Correct Answer! +5 Coins Added.';

                // SAVE COINS TO FIREBASE SAFELY
                const userCoinsRef = database.ref('users/' + currentUser.uid + '/coins');
                userCoinsRef.transaction((currentValue) => {
                    return (currentValue || 0) + 5;
                }).then(() => {
                    setTimeout(generateQuestion, 1500);
                }).catch(error => {
                    console.error("Firebase Error:", error);
                    submitBtn.disabled = false;
                });

            } else {
                resultMsg.style.color = '#ff1744';
                resultMsg.innerText = 'Wrong Answer! Try Again.';
                setTimeout(() => {
                    submitBtn.disabled = false;
                }, 1000);
            }
        }
    </script>
</body>
</html>
