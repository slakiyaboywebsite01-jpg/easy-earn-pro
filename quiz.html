<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy Earn Pro - Math Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #f0f4f8;
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 15px;
        }
        .container {
            width: 100%;
            max-width: 450px;
            background: #ffffff;
            padding: 20px;
            border-radius: 24px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            text-align: center;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8fafc;
            padding: 12px 18px;
            border-radius: 16px;
            margin-bottom: 20px;
            border: 1px solid #e2e8f0;
        }
        .back-btn {
            color: #0f172a;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }
        .back-btn:hover {
            color: #10b981;
        }
        .coin-box {
            background: linear-gradient(135deg, #10b981, #06b6d4);
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
        }
        .quiz-card {
            background: #f8fafc;
            padding: 25px 20px;
            border-radius: 20px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
            position: relative;
            overflow: hidden;
        }
        .quiz-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #10b981, #06b6d4);
        }
        .quiz-card p {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 15px;
        }
        .quiz-card p b {
            color: #10b981;
        }
        .question-text {
            font-size: 38px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 20px;
        }
        .answer-input {
            width: 100%;
            padding: 15px;
            background: #ffffff;
            border: 2px solid #cbd5e1;
            border-radius: 14px;
            color: #0f172a;
            font-size: 22px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 18px;
            outline: none;
            transition: 0.3s;
        }
        .answer-input:focus {
            border-color: #10b981;
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.15);
        }
        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #10b981, #06b6d4);
            color: #ffffff;
            font-weight: 700;
            font-size: 16px;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
        }
        .submit-btn:disabled {
            background: #cbd5e1;
            color: #94a3b8;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }
        #result-msg {
            margin-top: 15px;
            font-weight: 600;
            font-size: 15px;
            min-height: 24px;
        }
        .ad-container {
            margin-top: 20px;
            padding: 10px;
            background: #f8fafc;
            border-radius: 14px;
            border: 1px solid #e2e8f0;
            overflow: hidden;
            display: flex;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <a href="main.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Back</a>
            <h3 style="font-size: 18px; color: #0f172a;">Math Quiz</h3>
            <div class="coin-box">
                <i class="fa-solid fa-coins"></i>
                <span id="user-coins">0</span>
            </div>
        </div>

        <!-- Quiz Card -->
        <div class="quiz-card">
            <p>Solve the question to earn <b>+5 Coins!</b></p>
            <div class="question-text" id="question">0 + 0 = ?</div>
            
            <input type="number" id="answerInput" class="answer-input" placeholder="Enter answer" autocomplete="off">
            
            <button id="submitBtn" class="submit-btn" onclick="submitAnswer()">SUBMIT ANSWER</button>
            
            <div id="result-msg"></div>
        </div>

        <!-- Adsterra Banner -->
        <div class="ad-container">
            <script async="async" data-cfasync="false" src="https://pl30586105.effectivecpmnetwork.com/ddfa585c0174aba472cef073b8d260d0/invoke.js"></script>
            <div id="container-ddfa585c0174aba472cef073b8d260d0"></div>
        </div>
    </div>

    <script>
        // FIREBASE CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyC2hkHUlQ1A6XxZmVijhVqhVsPPVZzoJ5Q",
            authDomain: "easy-earn-db419.firebaseapp.com",
            databaseURL: "https://easy-earn-db419-default-rtdb.firebaseio.com",
            projectId: "easy-earn-db419",
            storageBucket: "easy-earn-db419.firebasestorage.app",
            messagingSenderId: "443404620896",
            appId: "1:443404620896:web:4a5637954440a8f8c09f05",
            measurementId: "G-MTY2FYGFFQ"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        let currentUser = null;
        let correctAnswer = 0;

        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                database.ref('users/' + user.uid + '/coins').on('value', snapshot => {
                    document.getElementById('user-coins').innerText = snapshot.val() || 0;
                });
                generateQuestion();
            } else {
                window.location.href = "login.html";
            }
        });

        function generateQuestion() {
            const num1 = Math.floor(Math.random() * 40) + 10;
            const num2 = Math.floor(Math.random() * 40) + 5;
            
            correctAnswer = num1 + num2;
            document.getElementById('question').innerText = `${num1} + ${num2} = ?`;

            document.getElementById('answerInput').value = '';
            document.getElementById('result-msg').innerText = '';
            document.getElementById('submitBtn').disabled = false;
        }

        function submitAnswer() {
            const userInput = document.getElementById('answerInput').value.trim();
            const resultMsg = document.getElementById('result-msg');
            const submitBtn = document.getElementById('submitBtn');

            if (userInput === '') {
                resultMsg.style.color = '#ef4444';
                resultMsg.innerText = 'Please enter an answer!';
                return;
            }

            submitBtn.disabled = true;

            if (parseInt(userInput, 10) === correctAnswer) {
                resultMsg.style.color = '#10b981';
                resultMsg.innerText = 'Correct Answer! +5 Coins Added.';

                const userCoinsRef = database.ref('users/' + currentUser.uid + '/coins');
                userCoinsRef.transaction((currentValue) => {
                    return (currentValue || 0) + 5;
                }).then(() => {
                    setTimeout(generateQuestion, 1500);
                }).catch(error => {
                    console.error("Firebase Error:", error);
                    submitBtn.disabled = false;
                });

            } else {
                resultMsg.style.color = '#ef4444';
                resultMsg.innerText = 'Wrong Answer! Try Again.';
                setTimeout(() => {
                    submitBtn.disabled = false;
                }, 1000);
            }
        }
    </script>
</body>
</html>
