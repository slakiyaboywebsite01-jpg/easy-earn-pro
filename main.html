<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy Earn Pro - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #f0f4f8;
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 15px;
        }
        .container {
            width: 100%;
            max-width: 450px;
            background: #ffffff;
            padding: 20px;
            border-radius: 24px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            text-align: center;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8fafc;
            padding: 12px 18px;
            border-radius: 16px;
            margin-bottom: 20px;
            border: 1px solid #e2e8f0;
        }
        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            text-align: left;
        }
        .avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #10b981, #06b6d4);
            color: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
            box-shadow: 0 4px 10px rgba(16, 185, 129, 0.2);
        }
        .user-name {
            font-weight: 700;
            font-size: 15px;
            color: #0f172a;
        }
        .coin-box {
            background: linear-gradient(135deg, #10b981, #06b6d4);
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
        }
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 15px;
        }
        .nav-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 20px 15px;
            border-radius: 18px;
            text-decoration: none;
            color: #1e293b;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            transition: all 0.25s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .nav-card:hover {
            transform: translateY(-3px);
            background: #ffffff;
            border-color: #10b981;
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.12);
        }
        .card-icon {
            width: 50px;
            height: 50px;
            border-radius: 14px;
            background: #e0f2fe;
            color: #0284c7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }
        .nav-card:nth-child(1) .card-icon { background: #dcfce7; color: #15803d; }
        .nav-card:nth-child(2) .card-icon { background: #e0e7ff; color: #4338ca; }
        .nav-card:nth-child(3) .card-icon { background: #fef3c7; color: #b45309; }
        .nav-card:nth-child(4) .card-icon { background: #ffe4e6; color: #be123c; }

        .nav-card h4 {
            font-size: 15px;
            font-weight: 600;
        }
        .logout-btn {
            width: 100%;
            padding: 14px;
            background: #f1f5f9;
            color: #ef4444;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            font-weight: 600;
            font-size: 15px;
            margin-top: 20px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .logout-btn:hover {
            background: #fee2e2;
            border-color: #fca5a5;
        }
        .ad-container {
            margin-top: 20px;
            padding: 10px;
            background: #f8fafc;
            border-radius: 14px;
            border: 1px solid #e2e8f0;
            overflow: hidden;
            display: flex;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="user-profile">
                <div class="avatar" id="user-avatar">U</div>
                <div class="user-name" id="user-name">Loading...</div>
            </div>
            <div class="coin-box">
                <i class="fa-solid fa-coins"></i>
                <span id="user-coins">0</span>
            </div>
        </div>

        <!-- Cards Navigation -->
        <div class="dashboard-grid">
            <a href="quiz.html" class="nav-card">
                <div class="card-icon"><i class="fa-solid fa-calculator"></i></div>
                <h4>Math Quiz</h4>
            </a>
            <a href="wheel.html" class="nav-card">
                <div class="card-icon"><i class="fa-solid fa-dharmachakra"></i></div>
                <h4>Spin & Earn</h4>
            </a>
            <a href="games.html" class="nav-card">
                <div class="card-icon"><i class="fa-solid fa-list-check"></i></div>
                <h4>Offerwall</h4>
            </a>
            <a href="withdraw.html" class="nav-card">
                <div class="card-icon"><i class="fa-solid fa-wallet"></i></div>
                <h4>Withdraw</h4>
            </a>
        </div>

        <button class="logout-btn" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>

        <!-- Adsterra Banner -->
        <div class="ad-container">
            <script async="async" data-cfasync="false" src="https://pl30586105.effectivecpmnetwork.com/ddfa585c0174aba472cef073b8d260d0/invoke.js"></script>
            <div id="container-ddfa585c0174aba472cef073b8d260d0"></div>
        </div>
    </div>

    <script>
        // FIREBASE CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyC2hkHUlQ1A6XxZmVijhVqhVsPPVZzoJ5Q",
            authDomain: "easy-earn-db419.firebaseapp.com",
            databaseURL: "https://easy-earn-db419-default-rtdb.firebaseio.com",
            projectId: "easy-earn-db419",
            storageBucket: "easy-earn-db419.firebasestorage.app",
            messagingSenderId: "443404620896",
            appId: "1:443404620896:web:4a5637954440a8f8c09f05",
            measurementId: "G-MTY2FYGFFQ"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        auth.onAuthStateChanged(user => {
            if (user) {
                database.ref('users/' + user.uid).on('value', snapshot => {
                    const data = snapshot.val();
                    if (data) {
                        const name = data.username || 'User';
                        document.getElementById('user-name').innerText = name;
                        document.getElementById('user-avatar').innerText = name.charAt(0).toUpperCase();
                        document.getElementById('user-coins').innerText = data.coins || 0;
                    }
                });
            } else {
                window.location.href = "login.html";
            }
        });

        function logout() {
            auth.signOut().then(() => {
                window.location.href = "login.html";
            });
        }
    </script>
</body>
</html>
