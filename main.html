<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy Earn Pro - Dashboard</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #0d1117;
            color: #ffffff;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        .app-container {
            width: 100%;
            max-width: 480px;
            background: #161b22;
            min-height: 100vh;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        
        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 1px solid #30363d;
        }
        .user-info h3 {
            font-size: 16px;
            color: #8b949e;
        }
        .user-info h2 {
            font-size: 20px;
            color: #00e676;
        }
        .logout-btn {
            background: #ff5252;
            color: #fff;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        /* Balance Card */
        .balance-card {
            background: linear-gradient(135deg, #00c853, #00e676);
            border-radius: 16px;
            padding: 25px;
            text-align: center;
            margin-top: 20px;
            color: #0d1117;
            box-shadow: 0 4px 15px rgba(0, 230, 118, 0.3);
        }
        .balance-card h4 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 5px;
        }
        .balance-card h1 {
            font-size: 40px;
            font-weight: 700;
        }
        
        /* Menu Grid */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 25px;
        }
        .menu-item {
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            text-decoration: none;
            color: #fff;
            transition: 0.3s;
        }
        .menu-item i {
            font-size: 30px;
            color: #00e676;
            margin-bottom: 10px;
        }
        .menu-item h3 {
            font-size: 15px;
            font-weight: 600;
        }
        .menu-item:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <div class="user-info">
                <h3>Hello,</h3>
                <h2 id="userName">Loading...</h2>
            </div>
            <button class="logout-btn" onclick="logoutUser()">
                <i class="fa-solid fa-right-from-bracket"></i>
            </button>
        </div>

        <!-- Balance Card -->
        <div class="balance-card">
            <h4>Total Coins</h4>
            <h1 id="userCoins">0</h1>
        </div>

        <!-- Menu Grid -->
        <div class="menu-grid">
            <a href="wheel.html" class="menu-item">
                <i class="fa-solid fa-dharmachakra"></i>
                <h3>Spin Wheel</h3>
            </a>
            
            <a href="quiz.html" class="menu-item">
                <i class="fa-solid fa-calculator"></i>
                <h3>Math Quiz</h3>
            </a>
            
            <a href="games.html" class="menu-item">
                <i class="fa-solid fa-gamepad"></i>
                <h3>Play Games</h3>
            </a>
            
            <a href="withdraw.html" class="menu-item">
                <i class="fa-solid fa-wallet"></i>
                <h3>Withdraw</h3>
            </a>
        </div>
    </div>

    <script>
        // FIREBASE CONFIGURATION
        const firebaseConfig = {
            apiKey: "AIzaSyC2hkHUlQ1A6XxZmVijhVqhVsPPVZzoJ5Q",
            authDomain: "easy-earn-db419.firebaseapp.com",
            databaseURL: "https://easy-earn-db419-default-rtdb.firebaseio.com",
            projectId: "easy-earn-db419",
            storageBucket: "easy-earn-db419.firebasestorage.app",
            messagingSenderId: "443404620896",
            appId: "1:443404620896:web:4a5637954440a8f8c09f05",
            measurementId: "G-MTY2FYGFFQ"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        // Check Auth State
        auth.onAuthStateChanged(user => {
            if (user) {
                // Fetch User Data
                db.ref('users/' + user.uid).on('value', (snapshot) => {
                    const data = snapshot.val();
                    if(data) {
                        document.getElementById('userName').innerText = data.name;
                        document.getElementById('userCoins').innerText = data.coins;
                    }
                });
            } else {
                // Not logged in
                window.location.href = "login.html";
            }
        });

        // Logout Function
        function logoutUser() {
            auth.signOut().then(() => {
                window.location.href = "index.html";
            });
        }
    </script>
</body>
</html>
