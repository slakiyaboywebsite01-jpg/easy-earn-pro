            border-radius: 20px;

            font-size: 15px;

            align-items: center;

            border-radius: 16px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }
        .game-card::before {
            content: '';

            left: 0;

            background: linear-gradient(180deg, #10b981, #06b6d4);

        .play-btn {
            padding: 10px 18px;
            background: linear-gradient(135deg, #10b981, #06b6d4);
            color: #ffffff;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 10px rgba(16, 185, 129, 0.2);

                database.ref('users/' + user.uid + '/coins').on('value', snapshot => {
                    document.getElementById('user-coins').innerText = snapshot.val() || 0;

                window.location.href = "login.html";

        });

        const directLinkUrl = "https://www.effectivecpmnetwork.com/ge4dvmft?key=53ead59c0b1e593fdc17606cb2e41e49";

        function openOffer() {
            if (!currentUser) return;
            window.open(directLinkUrl, '_blank');

            database.ref('users/' + currentUser.uid + '/coins').transaction((curr) => {
                return (curr || 0) + 15;
            });
        }
    </script>
